// ===================== 力导布局 =====================
let alpha=1;
function step(){
  if(alpha<0.015)return;
  alpha*=0.9965;
  // springs
  for(const e of edges){const s=ET[e.t];let dx=e.B.x-e.A.x,dy=e.B.y-e.A.y;
    let d=Math.sqrt(dx*dx+dy*dy)||1;
    const len=s.len*(e.A.c!==e.B.c?2.0:1);const f=(d-len)*s.s*alpha;
    dx/=d;dy/=d;
    if(e.A.fx===null){e.A.vx+=dx*f;e.A.vy+=dy*f;}
    if(e.B.fx===null){e.B.vx-=dx*f;e.B.vy-=dy*f;}}
  // repulsion + collision
  for(let i=0;i<nodes.length;i++){const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y;let d2=dx*dx+dy*dy;if(d2>150000)continue;
      let d=Math.sqrt(d2)||1;const f=1500/d2*alpha;
      dx/=d;dy/=d;
      const min=a.r+b.r+20;
      let cf=0;if(d<min)cf=(min-d)*0.12;
      const tot=f+cf;
      if(a.fx===null){a.vx-=dx*tot;a.vy-=dy*tot;}
      if(b.fx===null){b.vx+=dx*tot;b.vy+=dy*tot;}}}
  // cluster gravity + centering
  for(const n of nodes){const c=CLM[n.c];
    n.vx+=(c.cx-n.x)*0.028*alpha;n.vy+=(c.cy-n.y)*0.028*alpha;
    n.vx+=(1300-n.x)*0.0004;n.vy+=(760-n.y)*0.0004;
    if(n.fx!==null){n.x=n.fx;n.y=n.fy;n.vx=0;n.vy=0;}
    else{n.vx*=0.82;n.vy*=0.82;n.x+=n.vx;n.y+=n.vy;}}
  draw();
}
function draw(){
  // hulls
  for(const c of CL){let cx=0,cy=0,k=0;
    for(const n of nodes)if(n.c===c.id){cx+=n.x;cy+=n.y;k++;}
    if(!k)continue;cx/=k;cy/=k;
    let rx=60,ry=60;
    for(const n of nodes)if(n.c===c.id){rx=Math.max(rx,Math.abs(n.x-cx)+n.r+46);ry=Math.max(ry,Math.abs(n.y-cy)+n.r+40);}
    const h=hullEls[c.id];h.setAttribute("cx",cx);h.setAttribute("cy",cy);h.setAttribute("rx",rx*1.05);h.setAttribute("ry",ry*1.08);
    const t=clabEls[c.id];t.setAttribute("x",cx);t.setAttribute("y",cy-ry*1.08-8);}
  // edges
  edges.forEach((e,i)=>{const l=eEls[i];
    const dx=e.B.x-e.A.x,dy=e.B.y-e.A.y;const d=Math.sqrt(dx*dx+dy*dy)||1;
    const mx=(e.A.x+e.B.x)/2-dy*0.12,my=(e.A.y+e.B.y)/2+dx*0.12;
    const tx=e.B.x-dx/d*(e.B.r+3),ty=e.B.y-dy/d*(e.B.r+3);
    l.setAttribute("d",`M${e.A.x},${e.A.y}Q${mx},${my} ${tx},${ty}`);});
  // nodes
  for(const n of nodes){const g=nEls[n.id].g;g.setAttribute("transform",`translate(${n.x},${n.y})`);}
}

let tx=0,ty=0,sc=1;
function applyT(){world.setAttribute("transform",`translate(${tx},${ty}) scale(${sc})`);}
function fit(maxSc){const w=innerWidth,h=innerHeight;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  nodes.forEach(n=>{x0=Math.min(x0,n.x-160);y0=Math.min(y0,n.y-120);x1=Math.max(x1,n.x+160);y1=Math.max(y1,n.y+120);});
  sc=Math.min(w/(x1-x0),h/(y1-y0),maxSc||0.85);
  tx=(w-(x1-x0)*sc)/2-x0*sc;ty=(h-(y1-y0)*sc)/2-y0*sc;applyT();}
let dragN=null,panning=false,lx=0,ly=0;
svg.addEventListener("pointerdown",e=>{panning=true;lx=e.clientX;ly=e.clientY;});
addEventListener("pointermove",e=>{
  if(dragN){dragN.fx=(e.clientX-tx)/sc;dragN.fy=(e.clientY-ty)/sc;alpha=Math.max(alpha,.06);}
  else if(panning){tx+=e.clientX-lx;ty+=e.clientY-ly;lx=e.clientX;ly=e.clientY;applyT();}});
addEventListener("pointerup",()=>{dragN=null;panning=false;});
svg.addEventListener("wheel",e=>{e.preventDefault();
  const k=e.deltaY<0?1.12:0.89;
  const mx=e.clientX,my=e.clientY;
  tx=mx-(mx-tx)*k;ty=my-(my-ty)*k;sc*=k;applyT();},{passive:false});
svg.addEventListener("click",()=>{hideTip();hideDetail();hilite(null);});

const tip=document.getElementById("tip");
function showTip(n,e){tip.innerHTML=`<b>${n.zh}</b>${n.en?" · "+n.en:""}<br><span style="color:#94a3b8;font-size:11px">${n.note}</span>`;
  tip.style.display="block";moveTip(e);}
function moveTip(e){tip.style.left=Math.min(e.clientX+14,innerWidth-300)+"px";tip.style.top=(e.clientY+14)+"px";}
function hideTip(){tip.style.display="none";}

const det=document.getElementById("detail");
function showDetail(n){
  document.getElementById("dname").textContent=n.zh;
  document.getElementById("den").textContent=n.en;
  document.getElementById("dclu").textContent=CLM[n.c].name+(n.imp>=3?" · ⭐核心人物":"");
  document.getElementById("dnote").textContent=n.note;
  const tName={advise:"师承",edu:"同班",found:"创立",flow:"流动",col:"合作"};
  const rows=edges.filter(e=>e.A===n||e.B===n).map(e=>{
    const other=e.A===n?e.B:e.A;
    const dir=e.A===n?`→ <b>${other.zh}</b>`:`← <b>${other.zh}</b>`;
    return `<div>[${tName[e.t]}${e.lb?"·"+e.lb:""}] ${dir}</div>`;}).join("");
  document.getElementById("drel").innerHTML=rows||"<div>无连接</div>";
  det.style.display="block";}
function hideDetail(){det.style.display="none";}
document.getElementById("x").onclick=hideDetail;

function hilite(n){
  const sel=n?new Set([n.id,...edges.filter(e=>e.A===n).map(e=>e.B.id),...edges.filter(e=>e.B===n).map(e=>e.A.id)]):null;
  nodes.forEach(m=>{const o=sel?(sel.has(m.id)?1:0.15):1;nEls[m.id].g.setAttribute("opacity",o);});
  edges.forEach((e,i)=>{eEls[i].setAttribute("stroke-opacity",sel?(sel.has(e.A.id)&&sel.has(e.B.id)?0.9:0.05):0.55);});}

const q=document.getElementById("search");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){nodes.forEach(m=>nEls[m.id].g.setAttribute("opacity",1));return;}
  nodes.forEach(m=>{const hit=(m.zh+m.en).toLowerCase().includes(v);
    nEls[m.id].g.setAttribute("opacity",hit?1:0.12);});});

document.getElementById("reheat").onclick=()=>{alpha=1;};
document.getElementById("fit").onclick=fit;

// export mode: hide interactive controls, settle layout fully, bigger fonts
const EXPORT=new URLSearchParams(location.search).has("export");
if(EXPORT){
  document.getElementById("search").style.display="none";
  document.querySelectorAll(".btn").forEach(b=>b.style.display="none");
  document.getElementById("hud").querySelector(".sub").textContent=
    "学术师承 · 联合创立 · 职业流动 —— 从1956达特茅斯到今天的AI创业圈";
  const st=document.createElement("style");
  st.textContent=".nlabel{font-size:15px}.clabel{font-size:20px}";
  document.head.appendChild(st);
}

const PRE=EXPORT?1400:400;
for(let i=0;i<PRE;i++)step();
fit(EXPORT?2.6:0.85);

if(!EXPORT)(function loop(){step();requestAnimationFrame(loop);})();
</script>
</body>
</html>
